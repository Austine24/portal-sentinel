<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
  </defs>
  <rect width="1200" height="600" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#e2e8f0">Evidence flow: from detection to verifiable proof</text>
  <text x="40" y="78" font-size="13" fill="#94a3b8">What was this incident, and can anyone check it later? Status as of 2026-10-21. On-chain steps: code and tests done, waiting for the first real testnet deployment.</text>
  <rect x="840" y="34" width="14" height="14" rx="3" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="862" y="46" font-size="12" fill="#cbd5e1">built and tested</text>
  <rect x="980" y="34" width="14" height="14" rx="3" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1002" y="46" font-size="12" fill="#cbd5e1">built, not yet run on-chain</text>

  <text x="40" y="116" font-size="13" font-weight="600" fill="#34d399">OFF-CHAIN: working today</text>
  <text x="176" y="306" font-size="13" font-weight="600" fill="#fbbf24">ON-CHAIN: code ready, waiting for the first real deployment</text>

  <!-- row 1 -->
  <rect x="40" y="128" width="230" height="130" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="62" y="156" font-size="12" fill="#6ee7b7">STEP 1</text>
  <text x="62" y="178" font-size="16" font-weight="700" fill="#e2e8f0">Detect</text>
  <text x="62" y="202" font-size="12" fill="#cbd5e1">Rules, an anomaly model and the</text>
  <text x="62" y="219" font-size="12" fill="#cbd5e1">risk engine score an account</text>
  <text x="62" y="236" font-size="12" fill="#cbd5e1">against its own baseline.</text>

  <rect x="350" y="128" width="230" height="130" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="372" y="156" font-size="12" fill="#6ee7b7">STEP 2</text>
  <text x="372" y="178" font-size="16" font-weight="700" fill="#e2e8f0">Create incident</text>
  <text x="372" y="202" font-size="12" fill="#cbd5e1">Saved in MySQL with a status</text>
  <text x="372" y="219" font-size="12" fill="#cbd5e1">workflow and an audit timeline.</text>
  <text x="372" y="236" font-size="12" fill="#cbd5e1">No duplicate incidents.</text>

  <rect x="660" y="128" width="230" height="130" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="682" y="156" font-size="12" fill="#6ee7b7">STEP 3</text>
  <text x="682" y="178" font-size="16" font-weight="700" fill="#e2e8f0">Prepare evidence</text>
  <text x="682" y="202" font-size="12" fill="#cbd5e1">Freeze account, risk score, rule</text>
  <text x="682" y="219" font-size="12" fill="#cbd5e1">findings and a random nonce.</text>
  <text x="682" y="236" font-size="12" fill="#cbd5e1">Status changes never alter it.</text>

  <rect x="970" y="128" width="190" height="130" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="990" y="156" font-size="12" fill="#6ee7b7">STEP 4</text>
  <text x="990" y="178" font-size="16" font-weight="700" fill="#e2e8f0">Hash</text>
  <text x="990" y="202" font-size="12" fill="#cbd5e1">Canonical JSON, SHA-256.</text>
  <text x="990" y="219" font-size="12" fill="#cbd5e1">Contract key = SHA-256 of</text>
  <text x="990" y="236" font-size="12" fill="#cbd5e1">incident id + nonce.</text>

  <path d="M270 193 H350" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M580 193 H660" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M890 193 H970" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1065 258 V282 H155 V318" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>

  <!-- row 2 -->
  <rect x="40" y="318" width="230" height="130" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="62" y="346" font-size="12" fill="#fcd34d">STEP 5</text>
  <text x="62" y="368" font-size="16" font-weight="700" fill="#e2e8f0">Wallet signs</text>
  <text x="62" y="392" font-size="12" fill="#cbd5e1">The investigator approves</text>
  <text x="62" y="409" font-size="12" fill="#cbd5e1">record(id, hash, score) in their</text>
  <text x="62" y="426" font-size="12" fill="#cbd5e1">wallet. Keys stay in it.</text>

  <rect x="350" y="318" width="230" height="130" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="372" y="346" font-size="12" fill="#fcd34d">STEP 6</text>
  <text x="372" y="368" font-size="16" font-weight="700" fill="#e2e8f0">Registry contract</text>
  <text x="372" y="392" font-size="12" fill="#cbd5e1">Owner only, once per incident,</text>
  <text x="372" y="409" font-size="12" fill="#cbd5e1">emits EvidenceRecorded.</text>
  <text x="372" y="426" font-size="12" fill="#fde68a">Written, tested, not deployed.</text>

  <rect x="660" y="318" width="230" height="130" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="682" y="346" font-size="12" fill="#fcd34d">STEP 7</text>
  <text x="682" y="368" font-size="16" font-weight="700" fill="#e2e8f0">Link back</text>
  <text x="682" y="392" font-size="12" fill="#cbd5e1">Backend checks the chain itself,</text>
  <text x="682" y="409" font-size="12" fill="#cbd5e1">then saves hash and block on</text>
  <text x="682" y="426" font-size="12" fill="#cbd5e1">the incident.</text>

  <rect x="970" y="318" width="190" height="130" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="990" y="346" font-size="12" fill="#fcd34d">STEP 8</text>
  <text x="990" y="368" font-size="16" font-weight="700" fill="#e2e8f0">Verify</text>
  <text x="990" y="392" font-size="12" fill="#cbd5e1">verify(id, hash) on-chain, or</text>
  <text x="990" y="409" font-size="12" fill="#cbd5e1">the offline script (both</text>
  <text x="990" y="426" font-size="12" fill="#cbd5e1">built; on-chain untested).</text>

  <path d="M270 383 H350" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M580 383 H660" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M890 383 H970" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>

  <!-- honesty box -->
  <rect x="40" y="480" width="1120" height="92" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.5"/>
  <text x="62" y="508" font-size="14" font-weight="700" fill="#e2e8f0">What a record proves, and what it does not</text>
  <text x="62" y="532" font-size="13" fill="#a7f3d0">Proves: this exact evidence package existed at this time and was recorded by an authorised key. Any change to it fails verification.</text>
  <text x="62" y="554" font-size="13" fill="#fecaca">Does not prove: that the incident was real or malicious. Detection is anomaly-based and a human investigates. Sensitive details stay off-chain.</text>
</svg>
