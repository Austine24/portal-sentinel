<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
  </defs>
  <rect width="1200" height="790" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#e2e8f0">Portal Sentinel: system architecture</text>
  <text x="40" y="78" font-size="13" fill="#94a3b8">Security intelligence for the Portaldot ecosystem. Status as of 2026-10-17. All transaction data is DEMO / SIMULATED until a live Portaldot source is connected.</text>

  <!-- legend -->
  <rect x="800" y="34" width="14" height="14" rx="3" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="822" y="46" font-size="12" fill="#cbd5e1">built and tested</text>
  <rect x="930" y="34" width="14" height="14" rx="3" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="952" y="46" font-size="12" fill="#cbd5e1">planned or blocked</text>
  <rect x="1070" y="34" width="14" height="14" rx="3" fill="#0e2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="1092" y="46" font-size="12" fill="#cbd5e1">Portaldot</text>

  <!-- column A: user and frontend -->
  <rect x="40" y="120" width="230" height="64" rx="12" fill="#161f33" stroke="#475569" stroke-width="1.5"/>
  <text x="155" y="148" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Security investigator</text>
  <text x="155" y="168" font-size="12" fill="#94a3b8" text-anchor="middle">reviews and decides</text>

  <rect x="40" y="240" width="230" height="130" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="155" y="268" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">React + TypeScript UI</text>
  <text x="155" y="291" font-size="12" fill="#a7f3d0" text-anchor="middle">Dashboard · Incidents</text>
  <text x="155" y="309" font-size="12" fill="#a7f3d0" text-anchor="middle">Evidence panel · AI page</text>
  <text x="155" y="333" font-size="12" fill="#94a3b8" text-anchor="middle">Vite · Tailwind · Recharts</text>
  <text x="155" y="351" font-size="12" fill="#94a3b8" text-anchor="middle">responses validated with zod</text>

  <rect x="40" y="600" width="230" height="82" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="630" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Browser wallet</text>
  <text x="155" y="652" font-size="12" fill="#fde68a" text-anchor="middle">signs the on-chain record</text>
  <text x="155" y="670" font-size="12" fill="#94a3b8" text-anchor="middle">keys never touch Sentinel</text>

  <!-- column B: backend -->
  <rect x="330" y="100" width="470" height="640" rx="16" fill="#0d1526" stroke="#334155" stroke-width="1.5"/>
  <text x="352" y="128" font-size="16" font-weight="700" fill="#e2e8f0">FastAPI backend (Python)</text>

  <rect x="352" y="146" width="426" height="52" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="170" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">REST API · input validation (Pydantic) · CORS</text>
  <text x="565" y="188" font-size="12" fill="#a7f3d0" text-anchor="middle">/api/incidents · /api/evidence · /api/assessments</text>

  <rect x="352" y="226" width="426" height="86" rx="10" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="372" y="248" font-size="13" font-weight="600" fill="#e2e8f0">DataSource interface (the adapter)</text>
  <rect x="372" y="260" width="186" height="40" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="465" y="277" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">SimulatedSource</text>
  <text x="465" y="292" font-size="11" fill="#fde68a" text-anchor="middle">DEMO / SIMULATED</text>
  <rect x="574" y="260" width="186" height="40" rx="8" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="667" y="277" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">PortaldotSource</text>
  <text x="667" y="292" font-size="11" fill="#94a3b8" text-anchor="middle">live testnet data (next)</text>

  <rect x="352" y="338" width="208" height="62" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="456" y="362" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rule engine</text>
  <text x="456" y="381" font-size="11" fill="#a7f3d0" text-anchor="middle">SR-001 burst · SR-002 value</text>
  <rect x="570" y="338" width="208" height="62" rx="10" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="674" y="362" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Isolation Forest</text>
  <text x="674" y="381" font-size="11" fill="#94a3b8" text-anchor="middle">anomaly score (planned)</text>

  <rect x="352" y="426" width="426" height="54" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="450" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Risk engine</text>
  <text x="565" y="469" font-size="11" fill="#a7f3d0" text-anchor="middle">configurable weights · explained factors · Low to Critical bands</text>

  <rect x="352" y="506" width="426" height="54" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="530" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Incident service</text>
  <text x="565" y="549" font-size="11" fill="#a7f3d0" text-anchor="middle">status workflow · audit timeline · duplicate protection</text>

  <rect x="352" y="586" width="426" height="62" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="610" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Evidence service</text>
  <text x="565" y="629" font-size="11" fill="#a7f3d0" text-anchor="middle">frozen canonical JSON · SHA-256 hash · on-chain incident id</text>

  <rect x="352" y="672" width="426" height="52" rx="10" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="565" y="695" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chain client (EVM JSON-RPC, read-only first)</text>
  <text x="565" y="713" font-size="11" fill="#94a3b8" text-anchor="middle">connection check written; first live call pending</text>

  <!-- column C -->
  <rect x="860" y="130" width="300" height="70" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="1010" y="158" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Independent verifier script</text>
  <text x="1010" y="177" font-size="11" fill="#a7f3d0" text-anchor="middle">scripts/verify_evidence.py (standard library)</text>
  <text x="1010" y="193" font-size="11" fill="#94a3b8" text-anchor="middle">re-hashes a package, shares no code</text>

  <rect x="860" y="240" width="300" height="86" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="1010" y="268" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">MySQL database</text>
  <text x="1010" y="288" font-size="11" fill="#a7f3d0" text-anchor="middle">incidents · incident_events</text>
  <text x="1010" y="305" font-size="11" fill="#94a3b8" text-anchor="middle">versioned with Alembic migrations</text>

  <rect x="860" y="400" width="300" height="324" rx="14" fill="#0e2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="1010" y="428" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Portaldot V3 testnet</text>
  <text x="1010" y="448" font-size="11" fill="#94a3b8" text-anchor="middle">endpoints announced by the organizers 2026-10-16</text>

  <rect x="880" y="466" width="260" height="62" rx="9" fill="#12354a" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="1010" y="490" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">EVM JSON-RPC · chain id 420420777</text>
  <text x="1010" y="509" font-size="11" fill="#94a3b8" text-anchor="middle">reachability check in progress</text>

  <rect x="880" y="544" width="260" height="78" rx="9" fill="#2a2210" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1010" y="568" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">SentinelEvidenceRegistry</text>
  <text x="1010" y="587" font-size="11" fill="#fde68a" text-anchor="middle">Solidity: written, 9 tests pass</text>
  <text x="1010" y="605" font-size="11" fill="#fde68a" text-anchor="middle">NOT deployed yet (needs funded wallet)</text>

  <rect x="880" y="638" width="260" height="62" rx="9" fill="#12354a" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="1010" y="662" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Node console (explorer)</text>
  <text x="1010" y="681" font-size="11" fill="#94a3b8" text-anchor="middle">independent proof of transactions</text>

  <!-- arrows -->
  <path d="M155 184 V240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M270 290 H311 V172 H352" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="276" y="283" font-size="10" fill="#94a3b8">JSON</text>
  <path d="M565 198 V226" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M565 312 V338" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M565 400 V426" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M565 480 V506" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M565 560 V586" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M565 648 V672" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M778 533 H812 V283 H860" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M778 698 H828 V497 H880" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M155 682 V764 H1010 V724" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <text x="330" y="758" font-size="10" fill="#fde68a">signed transaction goes from the wallet straight to the Portaldot RPC</text>
  <path d="M155 370 V600" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
</svg>
